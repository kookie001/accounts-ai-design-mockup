<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accounts AI — Design Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261107b">
</head>
<body>

<div class="stage">
  <div class="stage-label">Accounts AI — Design Mockup (Android)</div>

  <div class="phone">
    <div class="phone-punchhole"></div>

    <div class="phone-screen" id="phone">

      <!-- ============ TAB SCREENS ============ -->

      <!-- HOME -->
      <section class="screen tab active" id="screenHome">
        <div class="glow glow-a"></div><div class="glow glow-b"></div>
        <div class="scroll" id="homeScroll">
          <header class="header">
            <button class="avatar-btn" data-action="open-drawer" aria-label="Profile"><span class="avatar">AG</span></button>
            <div class="header-right">
              <button class="icon-btn bare" aria-label="Notifications"><span data-icon="bell" data-size="24"></span><i class="dot"></i></button>
              <button class="icon-btn bare" aria-label="Search"><span data-icon="search" data-size="24"></span></button>
            </div>
          </header>

          <div id="homeIdle">
            <h2 class="section-title">Transaction</h2>
            <div class="chips">
              <button class="chip" data-chip="chat"><span data-icon="chat" data-size="16"></span>AI chat</button>
              <button class="chip" data-go="sales"><span data-icon="trending" data-size="16"></span>Sales</button>
              <button class="chip" data-go="purchase"><span data-icon="cart" data-size="16"></span>Purchase</button>
              <button class="chip" data-chip="gold"><span data-icon="swap" data-size="16"></span>Gold in/out</button>
              <button class="chip" data-chip="upload"><span data-icon="upload" data-size="16"></span>Upload</button>
            </div>

            <h2 class="section-title">Report</h2>
            <div class="chips">
              <button class="chip ai" data-chip="chat"><span data-icon="chat" data-size="16"></span>AI chat</button>
              <button class="chip" data-report="sales"><span data-icon="trending" data-size="16"></span>Sales</button>
              <button class="chip" data-report="purchase"><span data-icon="cart" data-size="16"></span>Purchase</button>
              <button class="chip" data-report="stock"><span data-icon="cube" data-size="16"></span>Stock</button>
            </div>
          </div>

        </div>

        <!-- composer -->
        <div class="composer-wrap" id="homeComposer">
          <div class="composer glass">
            <button class="round" id="plusBtn" data-plus aria-label="Add"><span data-icon="plus" data-size="22"></span></button>
            <input id="chatInput" placeholder="Ask about a bill, invoice, or amount…" autocomplete="off">
            <button class="round" id="micBtn" data-mic aria-label="Mic"><span data-icon="mic" data-size="19"></span></button>
            <button class="round send" id="sendBtn" data-send aria-label="Send" hidden><span data-icon="arrow-up" data-size="19"></span></button>
          </div>
        </div>

        <!-- attach menu -->
        <div class="attach-layer" id="attachLayer" hidden>
          <div class="attach-menu">
            <button class="attach-opt" data-action="click"><span class="attach-ic"><span data-icon="camera" data-size="19"></span></span><span><b>Click</b><small>Camera se photo</small></span></button>
            <button class="attach-opt" data-action="upload"><span class="attach-ic"><span data-icon="upload" data-size="19"></span></span><span><b>Upload</b><small>Excel / CSV file</small></span></button>
          </div>
        </div>
      </section>

      <!-- TRANSACTIONS -->
      <section class="screen tab" id="screenTransactions">
        <div class="scroll pad-tab">
          <header class="header">
            <button class="avatar-btn" data-action="open-drawer"><span class="avatar">AG</span></button>
            <div class="header-right">
              <button class="icon-btn bare"><span data-icon="bell" data-size="24"></span><i class="dot"></i></button>
              <button class="icon-btn bare"><span data-icon="search" data-size="24"></span></button>
            </div>
          </header>
          <h2 class="page-title">Transactions</h2>
          <div id="txList" class="list"></div>
        </div>
      </section>

      <!-- REPORTS -->
      <section class="screen tab" id="screenReports">
        <div class="scroll pad-tab">
          <header class="header">
            <button class="avatar-btn" data-action="open-drawer"><span class="avatar">AG</span></button>
            <div class="header-right">
              <button class="icon-btn bare"><span data-icon="bell" data-size="24"></span><i class="dot"></i></button>
              <button class="icon-btn bare"><span data-icon="search" data-size="24"></span></button>
            </div>
          </header>
          <h2 class="page-title">Reports</h2>
          <div class="stat-row">
            <div class="card stat"><small>Total Spent</small><b>₹24,960</b><i style="background:linear-gradient(90deg,#8A6BFF,#4E8CF5)"></i></div>
            <div class="card stat"><small>Total Income</small><b>₹46,200</b><i style="background:linear-gradient(90deg,#3DE8B4,#1FAE85)"></i></div>
          </div>
          <div class="card" style="padding:20px">
            <h3 class="card-title" style="font-size:13.5px">Weekly spend</h3>
            <div class="bars" id="bars"></div>
          </div>
        </div>
      </section>

      <!-- FLOATING TAB BAR -->
      <nav class="tabbar glass" id="tabbar">
        <button class="tab-btn active" data-tab="Home"><i class="tab-ind"></i><span class="tab-pill"><span data-icon="home" data-size="20"></span></span><small>Home</small></button>
        <button class="tab-btn" data-tab="Transactions"><i class="tab-ind"></i><span class="tab-pill"><span data-icon="swap" data-size="20"></span></span><small>Transactions</small></button>
        <button class="tab-btn" data-tab="Reports"><i class="tab-ind"></i><span class="tab-pill"><span data-icon="bar" data-size="20"></span></span><small>Reports</small></button>
      </nav>

      <!-- ============ STACK SCREENS ============ -->

      <!-- ENTRY (sales / purchase) -->
      <section class="screen stack" id="screenEntry">
        <div class="glow glow-a"></div>
        <div class="scroll">
          <div class="topbar">
            <button class="icon-btn" data-action="back"><span data-icon="chev-left" data-size="20"></span></button>
            <h1 id="entryTitle">Sales report</h1>
          </div>
          <div id="entryBody"></div>
        </div>
      </section>

      <!-- REPORT (sales / purchase) -->
      <section class="screen stack" id="screenReport">
        <div class="glow glow-a"></div>
        <div class="scroll">
          <div class="topbar">
            <button class="icon-btn" data-action="back"><span data-icon="chev-left" data-size="20"></span></button>
            <h1 id="reportTitle">Sales</h1>
          </div>
          <div id="reportBody"></div>
        </div>
      </section>

      <!-- STOCK -->
      <section class="screen stack" id="screenStock">
        <div class="glow glow-a"></div>
        <div class="scroll">
          <div class="topbar">
            <button class="icon-btn" data-action="back"><span data-icon="chev-left" data-size="20"></span></button>
            <h1>Stock</h1>
          </div>
          <div id="stockBody"></div>
        </div>
      </section>

      <!-- AI CHAT -->
      <section class="screen stack" id="screenChat">
        <div class="glow glow-a"></div>
        <div class="scroll" id="chatScroll">
          <div class="topbar">
            <button class="icon-btn" data-action="back"><span data-icon="chev-left" data-size="20"></span></button>
            <h1>AI chat</h1>
          </div>
          <div id="chatThread" class="thread"></div>
        </div>
        <div class="composer-wrap stack" id="chatComposer">
          <div class="composer glass">
            <button class="round" data-plus aria-label="Add"><span data-icon="plus" data-size="22"></span></button>
            <input placeholder="Ask about a bill, invoice, or amount…" autocomplete="off">
            <button class="round" data-mic aria-label="Mic"><span data-icon="mic" data-size="19"></span></button>
            <button class="round send" data-send aria-label="Send" hidden><span data-icon="arrow-up" data-size="19"></span></button>
          </div>
        </div>
        <div class="attach-layer" id="attachLayer2" hidden>
          <div class="attach-menu">
            <button class="attach-opt" data-action="click"><span class="attach-ic"><span data-icon="camera" data-size="19"></span></span><span><b>Click</b><small>Camera se photo</small></span></button>
            <button class="attach-opt" data-action="upload"><span class="attach-ic"><span data-icon="upload" data-size="19"></span></span><span><b>Upload</b><small>Excel / CSV file</small></span></button>
          </div>
        </div>
      </section>

      <!-- STOCK DETAIL -->
      <section class="screen stack" id="screenStockDetail">
        <div class="glow glow-a"></div>
        <div class="scroll">
          <div class="topbar">
            <button class="icon-btn" data-action="back-stock"><span data-icon="chev-left" data-size="20"></span></button>
            <h1>Stock</h1>
          </div>
          <div id="stockDetailBody"></div>
        </div>
      </section>

      <!-- ============ PROFILE DRAWER ============ -->
      <div class="drawer-layer" id="drawerLayer">
        <div class="drawer-backdrop" data-action="close-drawer"></div>
        <aside class="drawer">
          <button class="icon-btn small" data-action="close-drawer"><span data-icon="x" data-size="17"></span></button>
          <div class="drawer-profile">
            <span class="avatar big">AG</span>
            <b>Amit Gupta</b>
            <small class="premium"><span data-icon="diamond" data-size="11"></span> PREMIUM MEMBER</small>
          </div>
          <div class="card menu">
            <button class="menu-row"><span class="menu-ic" style="--c:#8A6BFF"><span data-icon="layers" data-size="15"></span></span><span>Masters</span><span data-icon="chev-right" data-size="14"></span></button>
            <button class="menu-row"><span class="menu-ic" style="--c:#3DE8B4"><span data-icon="grid" data-size="15"></span></span><span>Dashboard</span><span data-icon="chev-right" data-size="14"></span></button>
            <button class="menu-row"><span class="menu-ic" style="--c:#FFC474"><span data-icon="diamond" data-size="15"></span></span><span>Subscription</span><span data-icon="chev-right" data-size="14"></span></button>
            <button class="menu-row"><span class="menu-ic" style="--c:#FF84A0"><span data-icon="clock" data-size="15"></span></span><span>History</span><span data-icon="chev-right" data-size="14"></span></button>
            <button class="menu-row" id="themeRow"><span class="menu-ic neutral"><span data-icon="moon" data-size="15" id="themeIcon"></span></span><span id="themeLabel">Dark Mode</span><span class="switch" id="themeSwitch"><i></i></span></button>
          </div>
          <button class="logout"><span data-icon="logout" data-size="17"></span> Logout</button>
        </aside>
      </div>

    </div>
  </div>
</div>

<script src="script.js?v=20261107b"></script>
</body>
</html>
